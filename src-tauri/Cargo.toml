[package]
name = "pointify"
version = "0.3.0"
description = "PoinTify — asisten kecil di atas layar Windows lu"
authors = ["Ojan"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "pointify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
# Ikon app di widget Peluncur dikirim ke frontend sebagai PNG
png = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
# Dipakai macro `#[implement]` buat target drop OLE (penangkap file di notch).
windows-core = "0.62"
windows = { version = "0.62", features = [
  # Musik: kontrol media bawaan Windows (SMTC)
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  # Deteksi app fullscreen, biar notch sembunyi pas nonton atau main game
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  # Pip di desktop: baca tombol mouse pas Pip lagi diseret
  "Win32_UI_Input_KeyboardAndMouse",
  # Rak: cek apakah PoinTify jalan sebagai Administrator (drag dari Explorer keblok)
  "Win32_Security",
  "Win32_System_Threading",
  # Rak: jendela native penangkap file yang diseret ke notch
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  # Widget: statistik sistem, internet, mic, clipboard
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # Widget Peluncur: ambil ikon asli app/file/folder dari Windows
  "Win32_UI_Controls",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
