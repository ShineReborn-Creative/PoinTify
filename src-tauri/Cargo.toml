[package]
name = "pointify"
version = "0.2.0"
description = "PoinTify — asisten kecil di atas layar Windows lu"
authors = ["Ojan"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "pointify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  # Musik: kontrol media bawaan Windows (SMTC)
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  # Deteksi app fullscreen, biar notch sembunyi pas nonton atau main game
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  # Pip di desktop: baca tombol mouse pas Pip lagi diseret
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
